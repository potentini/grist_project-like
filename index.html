<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Projets, notes et actions — Grist</title>
    <link rel="stylesheet" href="workspace.css?v=20261113-quick-search" />
    <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
    <link rel="stylesheet" href="form-theme.css?v=20261113-contrast" />
  </head>
  <body>
    <header>
      <div>
        <strong>Projets, notes et actions</strong
        ><small>Un suivi partagé, du chantier à la prochaine action</small>
      </div>
      <nav aria-label="Vues">
        <button data-view="projects">Projets</button
        ><button data-view="notes">Notes et réunions</button
        ><button data-view="actions">À faire</button>
      </nav>
      <details id="phoneNav" class="phone-only">
        <summary id="phoneViewLabel">Actions</summary>
        <div>
          <button data-view="projects">Projets</button
          ><button data-view="streams">Chantiers</button
          ><button data-view="actions">Actions</button>
        </div>
      </details>
      <button
        id="phoneFilters"
        class="phone-only"
        type="button"
        aria-expanded="false"
        aria-controls="filterPanel"
      >
        Filtres
      </button>
      <button id="editionButton" aria-pressed="false">Édition désactivée</button
      ><button id="mappingButton">Mapping</button
      ><button id="refresh">Actualiser</button
      ><a href="timeline.html">Vue Table/Timeline</a>
    </header>
    <div id="message" role="status"></div>
    <div id="phoneSearch" class="phone-only" role="search"></div>
    <section
      id="mapping"
      hidden
      aria-label="Configuration des tables"
    ></section>
    <div id="filterPanel">
      <div class="filters">
        <label
          ><span id="projectFilterLabel">Projet</span>
          <select id="projectFilter"></select></label
        ><label
          ><span id="ownerFilterLabel">Responsable</span>
          <select id="ownerFilter"></select></label
        ><label
          ><span id="statusFilterLabel">Statut</span>
          <select id="statusFilter"></select></label
        ><label class="search"
          >Rechercher
          <input
            id="search"
            type="search"
            placeholder="Titre, notes, action…" /></label
        ><label
          ><input id="unlinked" type="checkbox" /> Actions sans
          rattachement</label
        ><label><input id="overdue" type="checkbox" /> Actions en retard</label>
        <label
          ><input id="showArchived" type="checkbox" /> Afficher les
          archivés</label
        >
      </div>
      <details id="advancedFilters">
        <summary>Filtres par niveau <span id="advancedCount"></span></summary>
        <div class="advanced-controls">
          <label
            >Niveau
            <select id="advancedKind"></select></label
          ><label
            >Champ
            <select id="advancedField"></select></label
          ><label>Contient <input id="advancedValue" type="search" /></label
          ><button id="advancedAdd" type="button">Ajouter le filtre</button
          ><button id="advancedClear" type="button">Tout effacer</button>
        </div>
        <div
          id="advancedChoices"
          aria-label="Valeurs disponibles du filtre"
        ></div>
        <div id="advancedChips" class="actions"></div>
      </details>
      <details id="hierarchySortSettings">
        <summary>Tri</summary>
        <div class="actions">
          <label
            >Projets
            <select id="trackingProjectSort"></select></label
          ><label
            >Niveaux inférieurs
            <select id="trackingChildSort"></select
          ></label>
        </div>
      </details>
    </div>
    <main>
      <button
        id="phoneBack"
        class="phone-only"
        type="button"
        aria-label="Retour à la liste"
        title="Retour à la liste"
      >
        ‹
      </button>
      <section id="list" tabindex="0" aria-label="Liste des éléments"></section>
      <div
        id="paneSeparator"
        role="separator"
        tabindex="0"
        aria-label="Largeur du volet gauche"
        aria-orientation="vertical"
        aria-controls="list detail"
        aria-valuemin="25"
        aria-valuemax="75"
        aria-valuenow="55"
        title="Glisser pour ajuster les volets ; flèches gauche/droite au clavier ; double-clic pour réinitialiser"
      ></div>
      <aside id="detail" tabindex="0" aria-label="Détail"></aside>
    </main>
    <dialog id="editor">
      <form id="editForm">
        <div class="dialoghead">
          <h2 id="editorTitle"></h2>
          <div class="editor-actions">
            <button id="save" type="submit">Enregistrer</button>
            <button type="button" id="cancel">Annuler</button>
          </div>
        </div>
        <div id="fields"></div>
        <p id="editError" role="alert"></p>
      </form>
    </dialog>
    <dialog id="moveDialog" aria-labelledby="moveTitle">
      <form id="moveForm">
        <h2 id="moveTitle"></h2>
        <label
          >Nouveau rattachement
          <select id="moveTarget" required></select
        ></label>
        <p id="moveError" role="alert"></p>
        <div class="actions">
          <button id="moveSubmit" type="submit">Déplacer</button
          ><button id="moveCancel" type="button">Annuler</button>
        </div>
      </form>
    </dialog>
    <dialog id="conversionDialog" aria-labelledby="conversionTitle">
      <form id="conversionForm">
        <h2 id="conversionTitle"></h2>
        <label
          ><span id="conversionParentLabel"></span
          ><select id="conversionParent" required></select
        ></label>
        <div id="conversionPreview"></div>
        <p id="conversionError" role="alert"></p>
        <div class="actions">
          <button id="conversionSubmit" type="submit">
            Confirmer la transformation</button
          ><button id="conversionCancel" type="button">Annuler</button>
        </div>
      </form>
    </dialog>
    <dialog id="removalDialog" aria-labelledby="removalTitle">
      <form id="removalForm">
        <h2 id="removalTitle"></h2>
        <div id="removalPreview"></div>
        <p id="removalError" role="alert"></p>
        <label
          ><input id="removalConfirm" type="checkbox" required /> Je confirme
          cette opération sur l’élément indiqué.</label
        >
        <div class="actions">
          <button id="removalSubmit" type="submit">Confirmer</button
          ><button id="removalCancel" type="button">Annuler</button>
        </div>
      </form>
    </dialog>
    <dialog id="projectTimeline" aria-labelledby="timelineTitle">
      <header>
        <h2 id="timelineTitle">Timeline du projet</h2>
        <button id="timelineClose" type="button">Fermer</button>
      </header>
      <iframe id="timelineFrame" title="Table et timeline du projet"></iframe>
    </dialog>
    <script src="hierarchy-sort.js?v=20261113-sorting"></script>
    <script src="workspace.js?v=20261113-quick-search"></script>
  </body>
</html>
